<title>Agenda Pastoral</title>

<style>
/* ── Design tokens ── */
:root {
  --bg:        #F7F6F3;
  --surface:   #FFFFFF;
  --surface2:  #EEECEA;
  --fg:        #1A1814;
  --fg2:       #6B6560;
  --fg3:       #9B948D;
  --accent:    #7A4F2F;
  --accent-lt: #F0E8E0;
  --gold:      #B8862A;
  --divider:   #E2DDD8;
  --card-r:    12px;
  --shadow:    0 2px 8px rgba(0,0,0,.07);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #18160F;
    --surface:   #231F16;
    --surface2:  #2C2820;
    --fg:        #F0EDE6;
    --fg2:       #A8A098;
    --fg3:       #6E6860;
    --accent:    #D4956A;
    --accent-lt: #2C201A;
    --gold:      #D4A84B;
    --divider:   #322E25;
    --shadow:    0 2px 8px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg:        #18160F;
    --surface:   #231F16;
    --surface2:  #2C2820;
    --fg:        #F0EDE6;
    --fg2:       #A8A098;
    --fg3:       #6E6860;
    --accent:    #D4956A;
    --accent-lt: #2C201A;
    --gold:      #D4A84B;
    --divider:   #322E25;
    --shadow:    0 2px 8px rgba(0,0,0,.3);
    color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--fg);
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

.app-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--divider);
  box-shadow: var(--shadow);
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}

.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  height: 60px;
}

.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-icon {
  width: 36px; height: 36px;
  background: var(--accent); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 18px;
}
.brand-text { font-family: 'Crimson Pro', Georgia, serif; font-size: 20px; font-weight: 700; color: var(--fg); line-height: 1; }
.brand-sub { font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: .08em; margin-top: 1px; }

.search-wrap { flex: 1; max-width: 320px; position: relative; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg3); pointer-events: none; }
#search {
  width: 100%; padding: 8px 10px 8px 34px;
  border: 1px solid var(--divider); border-radius: 8px;
  background: var(--surface2); color: var(--fg);
  font-family: inherit; font-size: 13px; outline: none; transition: border-color .15s;
}
#search:focus { border-color: var(--accent); }

.header-actions { display: flex; gap: 8px; flex-shrink: 0; }
.icon-btn {
  background: none; border: 1px solid var(--divider); border-radius: 8px;
  padding: 7px; cursor: pointer; color: var(--fg2);
  display: flex; align-items: center; transition: background .15s;
}
.icon-btn:hover { background: var(--surface2); }

.month-rail-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--divider);
  overflow-x: auto; scrollbar-width: none;
}
.month-rail-wrap::-webkit-scrollbar { display: none; }
.month-rail {
  max-width: 1100px; margin: 0 auto;
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 2px;
}
.m-btn {
  flex-shrink: 0; padding: 10px 14px 8px;
  border: none; background: none; cursor: pointer;
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
  color: var(--fg2); border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s; text-align: center; white-space: nowrap;
}
.m-btn .m-name { display: block; }
.m-btn .m-count { display: block; font-size: 10px; color: var(--fg3); margin-top: 1px; font-variant-numeric: tabular-nums; }
.m-btn:hover { color: var(--fg); }
.m-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.m-btn.active .m-count { color: var(--accent); }

.main {
  max-width: 1100px; margin: 0 auto;
  padding: 24px max(16px, env(safe-area-inset-left, 0px));
  padding-bottom: 48px;
}

/* Loading */
.loading-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 80px 24px; gap: 16px; color: var(--fg3);
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--divider);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state p { font-size: 14px; }

/* Sync status */
.sync-bar {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--fg3); margin-bottom: 20px;
}
.sync-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #22c55e; flex-shrink: 0;
}
.sync-dot.error { background: #ef4444; }
.sync-dot.loading { background: var(--gold); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.sync-time { color: var(--fg3); }
.refresh-btn {
  background: none; border: none; cursor: pointer;
  color: var(--accent); font-size: 11px; font-family: inherit;
  padding: 2px 6px; border-radius: 4px; text-decoration: underline;
}
.refresh-btn:hover { color: var(--fg); }

.today-banner {
  background: var(--accent-lt); border: 1px solid var(--accent);
  border-radius: var(--card-r); padding: 14px 18px; margin-bottom: 24px;
  display: flex; gap: 12px; align-items: flex-start;
}
.today-banner[hidden] { display: none !important; }
.banner-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
.banner-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
.banner-names { font-family: 'Crimson Pro', Georgia, serif; font-size: 16px; font-weight: 600; color: var(--fg); line-height: 1.4; }

.section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
.section-title { font-family: 'Crimson Pro', Georgia, serif; font-size: 28px; font-weight: 700; color: var(--fg); text-wrap: balance; }
.section-count { font-size: 13px; color: var(--fg3); font-variant-numeric: tabular-nums; }

.stats-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.stat { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--divider); border-radius: 8px; padding: 10px 14px; }
.stat-val { font-family: 'Crimson Pro', Georgia, serif; font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat-label { font-size: 11px; color: var(--fg3); line-height: 1.2; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

.card {
  background: var(--surface); border: 1px solid var(--divider);
  border-radius: var(--card-r); padding: 16px 18px; box-shadow: var(--shadow);
  transition: box-shadow .15s, border-color .15s;
  display: flex; flex-direction: column; gap: 12px;
}
.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); border-color: var(--accent); }
.card.today-card { border-color: var(--gold); background: linear-gradient(135deg, var(--surface) 80%, var(--accent-lt)); }

.card-top { display: flex; align-items: flex-start; gap: 12px; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--accent-lt); color: var(--accent);
  font-family: 'Crimson Pro', Georgia, serif; font-size: 18px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border: 1.5px solid var(--accent);
}
.card.today-card .avatar { background: var(--gold); color: #fff; border-color: var(--gold); }
.name-block { min-width: 0; }
.person-name { font-family: 'Crimson Pro', Georgia, serif; font-size: 16px; font-weight: 600; color: var(--fg); line-height: 1.2; text-wrap: balance; }
.person-rol { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; font-weight: 500; }
.birthday-date { margin-left: auto; flex-shrink: 0; text-align: right; }
.bday-day { font-family: 'Crimson Pro', Georgia, serif; font-size: 28px; font-weight: 700; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.bday-monthname { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); margin-top: 1px; }

.card-meta { display: flex; flex-direction: column; gap: 6px; }
.meta-row { display: flex; align-items: center; gap: 7px; color: var(--fg2); font-size: 12.5px; }
.meta-row svg { flex-shrink: 0; color: var(--fg3); }
.meta-row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--divider); }
.zona-badge { font-size: 11px; font-weight: 600; color: var(--fg3); background: var(--surface2); padding: 3px 8px; border-radius: 20px; }
.age-badge { font-size: 12px; color: var(--fg3); font-variant-numeric: tabular-nums; }
.age-num { font-weight: 600; color: var(--fg2); }
.today-ribbon { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); }

.empty { text-align: center; padding: 64px 24px; color: var(--fg3); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 15px; }

@media (max-width: 500px) {
  .brand-sub { display: none; }
  .section-title { font-size: 22px; }
  .stats-bar { gap: 10px; }
  .card-grid { grid-template-columns: 1fr; }
}
</style>

</div>

// CSV parsing
function parseCSVLine(line) {
  const cols = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { cols.push(cur.trim().replace(/^"|"$/g,'')); cur = ''; }
    else { cur += c; }
  }
  cols.push(cur.trim().replace(/^"|"$/g,''));
  return cols;
}

function parseDate(val) {
  if (!val) return { dia: null, mes: null, anio: null };
  val = val.trim();
  let m;
  // dd/mm/yyyy or dd-mm-yyyy
  m = val.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) return { dia: +m[1], mes: +m[2], anio: +m[3] };
  // yyyy-mm-dd
  m = val.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return { dia: +m[3], mes: +m[2], anio: +m[1] };
  // Excel serial number
  const n = parseInt(val);
  if (!isNaN(n) && n > 10000 && n < 60000) {
    const adj = n >= 60 ? n - 1 : n;
    const d = new Date(Date.UTC(1899, 11, 31) + adj * 86400000);
    return { dia: d.getUTCDate(), mes: d.getUTCMonth() + 1, anio: d.getUTCFullYear() };
  }
  return { dia: null, mes: null, anio: null };
}

  const dot = document.getElementById('syncDot');

  msgEl.textContent = msg;
}

function parseRows(rows) {
  const parsed = [];
  for (const row of rows) {
    const zona = row['Zona'] || '';
    const nombre = row['Nombres'] || '';
    const rol = row['Rol'] || '';
    const fnac = row['Fecha de Nacimiento'] || '';
    const celular = String(row['Celular'] || '').replace(/\D/g,'');
    const municipio = row['Municipio'] || '';
    if (!nombre) continue;
    const { dia, mes, anio } = parseDate(String(fnac));
    parsed.push({ zona, nombre, rol, celular, municipio, dia, mes, anio });
  }
  return parsed;
}

async function loadData() {
  setSyncStatus('loading', 'Cargando datos…');
  document.getElementById('refreshBtn').disabled = true;

  // Siempre mostrar datos locales inmediatamente
  if (DATA.length === 0) {
    DATA = parseRows(DATOS_LOCALES);
    document.getElementById('loadingState').hidden = true;
    document.getElementById('appContent').hidden = false;
    buildRail(); renderTodayBanner(); render(); scrollActiveMonth();
  }

  // Intentar sincronizar con Google Sheets en segundo plano
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(APPS_SCRIPT_URL + '?t=' + Date.now(), { signal: ctrl.signal });
    clearTimeout(tid);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    const parsed = parseRows(rows);
    if (parsed.length === 0) throw new Error('Sin datos');
    DATA = parsed;
    const t = new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    setSyncStatus('ok', `Conectado · ${DATA.length} registros · Actualizado ${t}`);
    document.getElementById('loadingState').hidden = true;
    document.getElementById('appContent').hidden = false;
    buildRail();
    renderTodayBanner();
    render();
    scrollActiveMonth();
  } catch(e) {
    const t = new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    setSyncStatus('ok', `Datos locales · ${DATA.length} registros · ${t} (sin conexión a Sheets)`);
  }
  document.getElementById('refreshBtn').disabled = false;
}

document.getElementById('refreshBtn').addEventListener('click', loadData);
document.getElementById('syncRefresh').addEventListener('click', loadData);

// Rail
function buildRail() {
  const rail = document.getElementById('monthRail');
  rail.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const count = DATA.filter(p => p.mes === m).length;
    const btn = document.createElement('button');
    btn.className = 'm-btn' + (m === activeMonth ? ' active' : '');
    btn.innerHTML = `<span class="m-name">${MONTHS_SHORT[m-1]}</span><span class="m-count">${count}</span>`;
    btn.addEventListener('click', () => { activeMonth = m; searchQuery = ''; document.getElementById('search').value = ''; render(); updateRail(); });
    rail.appendChild(btn);
  }
}
function updateRail() {
  document.querySelectorAll('.m-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i + 1 === activeMonth && !searchQuery);
  });
}

function renderTodayBanner() {
  const todayDay = now.getDate(), todayMes = now.getMonth() + 1;
  const todayPeople = DATA.filter(p => p.dia === todayDay && p.mes === todayMes);
  const banner = document.getElementById('todayBanner');
  banner.hidden = todayPeople.length === 0;
  if (todayPeople.length > 0)
    document.getElementById('todayNames').textContent = todayPeople.map(p => p.nombre).join(' · ');
}

function initials(name) {
  return name.split(' ').slice(0,2).map(w => w[0] || '').join('').toUpperCase();
}

function renderCard(p) {
  const todayDay = now.getDate(), todayMes = now.getMonth() + 1;
  const isToday = p.dia === todayDay && p.mes === todayMes;
  const age = now.getFullYear() - p.anio;
  const div = document.createElement('div');
  div.className = 'card' + (isToday ? ' today-card' : '');
  div.innerHTML = `
    <div class="card-top">
      <div class="avatar">${initials(p.nombre)}</div>
      <div class="name-block">
        <div class="person-name">${p.nombre}</div>
        <div class="person-rol">${p.rol}</div>
      </div>
      <div class="birthday-date">
        <div class="bday-day">${p.dia || '—'}</div>
        <div class="bday-monthname">${p.mes ? MONTHS_SHORT[p.mes-1] : ''}</div>
      </div>
    </div>
    <div class="card-meta">
      <div class="meta-row">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>${p.municipio}</span>
      </div>
      <div class="meta-row">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12a19.79 19.79 0 0 1-3.07-8.67 2 2 0 0 1 2-2.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span>${p.celular || '—'}</span>
      </div>
    </div>
    <div class="card-footer">
      <span class="zona-badge">${p.zona}</span>
      ${isToday
        ? `<span class="today-ribbon">🎂 ¡Hoy!</span>`
        : `<span class="age-badge">Cumple <span class="age-num">${p.anio ? age : '—'}</span> años</span>`}
    </div>`;
  return div;
}

function getFiltered() {
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    return DATA.filter(p =>
      p.nombre.toLowerCase().includes(q) ||
      p.municipio.toLowerCase().includes(q) ||
      p.zona.toLowerCase().includes(q)
    ).sort((a,b) => (a.mes - b.mes) || (a.dia - b.dia));
  }
  return DATA.filter(p => p.mes === activeMonth).sort((a,b) => a.dia - b.dia);
}

function renderStats(list) {
  const bar = document.getElementById('statsBar');
  if (searchQuery) { bar.innerHTML = ''; return; }
  const nextUp = list.filter(p => {
    const bday = new Date(now.getFullYear(), p.mes - 1, p.dia);
    return bday >= now;
  });
  bar.innerHTML = `
    <div class="stat"><div class="stat-val">${list.length}</div><div class="stat-label">Presbíteros<br>este mes</div></div>
    <div class="stat"><div class="stat-val">${nextUp.length}</div><div class="stat-label">Próximos<br>cumpleaños</div></div>
    <div class="stat"><div class="stat-val">${DATA.length}</div><div class="stat-label">Total en<br>registro</div></div>`;
}

function render() {
  updateRail();
  const list = getFiltered();
  document.getElementById('sectionTitle').textContent = searchQuery ? 'Resultados' : MONTHS[activeMonth-1];
  document.getElementById('sectionCount').textContent = `${list.length} presbítero${list.length !== 1 ? 's' : ''}`;
  renderStats(list);
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('empty').hidden = list.length > 0;
  list.forEach(p => grid.appendChild(renderCard(p)));
}

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

function scrollActiveMonth() {
  const btns = document.querySelectorAll('.m-btn');
  if (btns[activeMonth-1]) btns[activeMonth-1].scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
}

loadData();
</script>
